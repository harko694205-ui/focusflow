<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211f45"/>
      <stop offset="0.55" stop-color="#12121c"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c83ff" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#7c83ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c83ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#a3a8ff"/>
      <stop offset="0.5" stop-color="#7c83ff"/>
      <stop offset="1" stop-color="#3fd1b9"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="336" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ccff"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
    <!-- top sheen -->
    <ellipse cx="200" cy="-40" rx="320" ry="170" fill="#ffffff" opacity="0.05"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
  <!-- focus ring: track, glow, arc, head -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="30"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" stroke-dasharray="735 943" transform="rotate(-90 256 256)" filter="url(#soft)" opacity="0.55"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" stroke-dasharray="735 943" transform="rotate(-90 256 256)"/>
  <circle cx="108.7" cy="227.9" r="22" fill="#ffffff" opacity="0.35" filter="url(#soft)"/>
  <circle cx="108.7" cy="227.9" r="9" fill="#ffffff"/>
  <!-- flow bars, with a soft glow -->
  <g stroke="#b9bdff" stroke-width="30" stroke-linecap="round" filter="url(#soft)" opacity="0.45">
    <path d="M196 204h124"/>
    <path d="M196 256h84"/>
    <path d="M196 308h40"/>
  </g>
  <g stroke="url(#bar)" stroke-width="30" stroke-linecap="round">
    <path d="M196 204h124"/>
    <path d="M196 256h84"/>
    <path d="M196 308h40"/>
  </g>
</svg>
